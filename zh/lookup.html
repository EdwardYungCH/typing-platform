<!doctype html>
<html lang="zh-Hant-HK" data-world="magic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>速成查碼｜打字練習平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/world.css">
  <link rel="stylesheet" href="../css/lookup.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="../index.html">打字練習平台</a>
      <span class="crumb muted">字根魔法學院</span>
      <span class="spacer"></span>
      <a class="btn ghost" href="../index.html">回首頁</a>
    </header>

    <h1 class="lk-title">速成查碼</h1>
    <p class="muted">輸入或貼上中文字，看它的速成碼、怎樣拆字和選字。速成只打倉頡碼的<b>第一碼</b>和<b>最後一碼</b>。</p>

    <form class="lk-form" id="form" autocomplete="off">
      <input id="q" class="lk-input" maxlength="40" placeholder="例如：明想學校" aria-label="要查的中文字" lang="zh-Hant-HK">
      <button class="btn primary" type="submit">查碼</button>
    </form>

    <section id="results" class="lk-results" aria-live="polite"></section>

    <section class="card lk-roots">
      <h2>字根和輔助字形表</h2>
      <div id="roots"></div>
    </section>

    <p class="note muted" id="source"></p>
  </div>
  <script type="module" src="../js/lookup-page.js"></script>
</body>
</html>
